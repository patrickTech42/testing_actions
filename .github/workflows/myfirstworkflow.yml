name: my-first-workflow
# To get a trigger on every push
on: 
  schedule:
    - cron: "*/5 * * * *"

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04
    steps:
      - name: running signle command in job1
        run: echo "Hi, this is my first github workflow"
      - name: Checking os release for my github runner
        run: cat /etc/os-release

  job2:
    name: JOB2
    runs-on: ubuntu-latest
    steps:
      - name: Checking the hostname for runner
        run: hostname
      - name: Running multiple jobs
        run: |
          echo "Hi, from job 2"
          echo "current time is date"
          sleep 20

  job3:
    name: JOB3
    needs: job1
    runs-on: windows-latest
    steps:
      - name: Job with single dependency
        run: sleep 10
      - name: Checking runner info
        shell: pwsh
        run: get-computerinfo
  job4:
    name: JOB4
    needs: [job1, job2, job3]
    runs-on: macos-latest
    steps:
      - name: Job for multple dependencies
        run: sleep 10
      - name: checking runner info
        run: sw_vers
  
          
    
