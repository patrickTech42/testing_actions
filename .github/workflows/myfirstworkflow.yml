name: my-first-workflow
# To get a trigger on every push
on: 
  push:
    

jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04
    steps:
      - name: step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step 2     Checkout
        uses: actions/checkout@v6.1.0
      - name: Step 3
        run: |
          echo `pwd` >> myartifact.txt
          ls -ltr
          hostname
      - name: Step 4 upload single
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt

          
    
