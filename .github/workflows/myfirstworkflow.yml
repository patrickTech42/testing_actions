name: my-first-workflow
# To get a trigger on every push
on: 
  push:
    branches:
      - main

  pull_request:
    branches:
      -  main
env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80
    
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-22.04
    steps:
      - name: step 1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step 2     Checkout
        uses: actions/checkout@v6.1.0
      - name: Step 3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Step 4 upload single
        uses: actions/upload-artifact@v7.0.1
        with:
          name: single_file
          path: ./myartifact.txt

  job2:
    name: JOB2
    needs: job1
    runs-on: ubuntu-22.04
    steps:
      - name: checking current directory
        run: |
          pwd
          ls -ltr
      - name: download single file
        uses: actions/download-artifact@v7.0.0
        with: 
          name: single_file
      - name: checking after directory
        run: |
          pwd
          ls -ltr
      - name: referencing env vars
        run: |
          echo "[INFO] running deployment for $APP_USER of type $ENV_TYPE"
          echo "[INFO] and the last var $APP_PORT"
      
  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps: 
      - name: reffering something
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] New changer are added by ${{ github.actor }} in ${{ github.ref_name }} branch."
          echo "[INFO] current step is running on ${{ runner.os }}:"
          echo "[INFO] Current JOB ID is ${{ job.check_run_id }}."
    
        run: echo "[INFO] Application password is ${{ secrets.ADD_PASSOWRD }}"

